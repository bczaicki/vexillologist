version: 2

project_name: vexillologist

builds:
  - id: vex
    main: ./cmd/vex
    binary: vex
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/bczaicki/vexillologist/internal/cli.Version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "vex_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
